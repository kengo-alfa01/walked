name: Sengoku 100-pin release QA
on:
  pull_request:
    paths:
      - "index.html"
      - "sengoku/v2/approved-up-to-muneshige-pins-100.json"
      - "sengoku-v2-core.js"
      - "tests/sengoku-100-pin-qa.test.cjs"
      - "data/c-release/**"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sengoku/v2/approved-up-to-muneshige-pins-100.json"
      - "sengoku-v2-core.js"
      - "tests/sengoku-100-pin-qa.test.cjs"
      - "data/c-release/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check active release and old-version regression
        run: node --test tests/sengoku-100-pin-qa.test.cjs tests/sengoku-43-release.test.cjs tests/sengoku-v2.test.cjs
      - name: Check C-publication ledger
        run: node scripts/export-c-release-ledger.cjs --check
