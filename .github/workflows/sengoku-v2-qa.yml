name: Sengoku v2 branch QA

on:
  push:
    branches:
      - refactor/sengoku-v2-only-20261107
      - feature/sengoku-v2-approved-46-pins
      - feature/sengoku-20-ujimasa-20261111
      - fix/sengoku-published-pin-count-20261111
      - feature/sengoku-234-approved-pins-20261111
    paths:
      - 'index.html'
      - 'walked-core.js'
      - 'sengoku-v2-*.js'
      - 'sengoku/v2/**'
      - 'tests/**'
      - '.github/workflows/sengoku-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sengoku-v2-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    if: github.ref == 'refs/heads/refactor/sengoku-v2-only-20261107' || github.ref == 'refs/heads/feature/sengoku-v2-approved-46-pins' || github.ref == 'refs/heads/feature/sengoku-20-ujimasa-20261111' || github.ref == 'refs/heads/fix/sengoku-published-pin-count-20261111' || github.ref == 'refs/heads/feature/sengoku-234-approved-pins-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local test dependencies (not shipped)
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 topojson-client@3.1.0
      - name: Fetch pinned source municipalities geometry
        shell: bash
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error             'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson'             --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
          test -s .qa-assets/municipalities.topojson
          test -s .qa-assets/topojson-client.min.js
      - name: Run branch v2 and legacy regression suites
        env:
          WALKED_BROWSER_ASSETS: ${{ github.workspace }}/.qa-assets
        run: node --test tests/*.test.cjs
