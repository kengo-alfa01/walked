name: C new9 approved 80 PC and iPhone browser QA
on:
  push:
    branches: [c/new9-approved80-20261120]
    paths:
      - .github/workflows/c-20261120-new9-browser.yml
      - tests/c-20261120-new9-browser.smoke.cjs
      - sengoku/v2/approved-c-20261120-new9-80.json
      - index.html
      - sengoku-v2-core.js
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/c-20261120-new9-browser.yml
      - tests/c-20261120-new9-browser.smoke.cjs
      - sengoku/v2/approved-c-20261120-new9-80.json
      - index.html
      - sengoku-v2-core.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-desktop:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Prepare verified municipality geometry fixture
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Real iPhone WebKit touch, desktop Chromium and archived-card regression
        env:
          WALKED_BROWSER_ASSETS: .qa-assets
          WALKED_BASE_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walked-new9-http.log 2>&1 &
          sleep 2
          node --test tests/c-20261120-new9-browser.smoke.cjs
