name: C 2026-11-19 GitHub Pages deployed bytes proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/c-release-20261119-pages-proof.yml
      - index.html
      - sengoku-v2-core.js
      - sengoku/v2/approved-c-20261119.json
      - data/c-release/records.csv
      - data/c-release/status.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact GitHub Pages publication, not merely build success
        shell: bash
        run: |
          set -euo pipefail
          base=https://kengo-alfa01.github.io/walked
          files=(
            index.html
            sengoku-v2-core.js
            sengoku/v2/approved-c-20261119.json
            data/c-release/records.csv
            data/c-release/status.csv
          )
          for i in $(seq 1 90); do
            ok=true
            for f in "${files[@]}"; do
              mkdir -p "/tmp/pages/$(dirname "$f")"
              if ! curl --fail --location --silent --show-error --retry 2 --max-time 30 --header 'Cache-Control: no-cache' "$base/$f?audit=$GITHUB_SHA" --output "/tmp/pages/$f" 2>/dev/null; then
                ok=false
                break
              fi
              if ! cmp -s "$f" "/tmp/pages/$f"; then
                ok=false
                break
              fi
            done
            if $ok; then
              echo "PAGES_FULL_BYTES_MATCH_GITHUB_MAIN sha=$GITHUB_SHA attempt=$i"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo 'PAGES_MISMATCH_AFTER_90_ATTEMPTS'
              exit 1
            fi
            sleep 8
          done
          git hash-object data/c-release/status.csv
          cat /tmp/pages/data/c-release/status.csv
          node -e "const fs=require('fs');const f=JSON.parse(fs.readFileSync('/tmp/pages/sengoku/v2/approved-c-20261119.json'));const s=JSON.parse(fs.readFileSync('docs/c-release/20261119-fixed-approved-snapshot.json'));const p=JSON.parse(fs.readFileSync('docs/c-release/20261119-approved-pin-projection.json'));if(f.people.length!==65||f.histories.length!==1203||f.sites.length!==417||f.sites.filter(x=>x.publicPin).length!==350||f.retiredHistories.length!==31||s.fixed.length!==1230||p.ready.length!==16)process.exit(2);console.log('PAGES_RELEASE_PROOF',JSON.stringify({version:f.version,people:f.people.length,histories:f.histories.length,sites:f.sites.length,pins:350,retired:31}));"
