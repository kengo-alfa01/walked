name: C v8 Phase2 production PR QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sengoku/v2/approved-c-20261124-p2-88.json'
      - 'data/c-release/**'
      - 'tests/c-v8-phase2-release.browser.cjs'
      - '.github/workflows/c-v8-phase2-release-qa.yml'
  push:
    branches: ['release/c-phase2-minimal-20261124']

permissions:
  contents: read

jobs:
  approved-phase2-and-browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies without package scripts
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Verify Phase2 is exactly Phase1 plus approved additions
        run: |
          node scripts/export-c-release-ledger.cjs --check
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          const core=require('./sengoku-v2-core.js');
          const get=p=>JSON.parse(fs.readFileSync(p));
          const p1=get('sengoku/v2/approved-c-20261124-p1-74.json');
          const p2=get('sengoku/v2/approved-c-20261124-p2-88.json');
          const codes=new Set(get('data/title-registry.json').areas.map(x=>x.code));
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          assert.equal(p1.version,'v2-approved-c-20261124-p1-74');
          assert.equal(p2.version,'v2-approved-c-20261124-p2-88-v9');
          assert.deepEqual([p1.people.length,p1.histories.length,p1.sites.length,p1.sites.filter(x=>x.publicPin).length],[74,1421,506,473]);
          assert.deepEqual([p2.people.length,p2.histories.length,p2.sites.length,p2.relations.length,p2.sites.filter(x=>x.publicPin).length],[88,1589,553,868,521]);
          const c=core.validate(p2,codes,sha);
          assert.equal(c.people.size,88);
          const persons=new Set(p1.people.map(x=>x.personId));
          assert.equal(p2.people.filter(x=>!persons.has(x.personId)).length,14);
          const sites=new Map(p2.sites.map(s=>[s.siteId,s]));
          const blockedSites=new Set(['sg2site-a-joun-body-mound-20261111','sg2site-a-katsuyori-tano-20261111','sg2site-a-nobutora-kawada-old-20261111']);
          const approvedNewPins=new Set(['sg2site-a-miy-koshimizu-20261114','sg2site-a28-murakami-shioda-20261121','sg2site-a28-murakami-nechi-20261121','sg2site-a27-ujitsuna-taisekiji-1537-20261121']);
          for(const site of p1.sites){
            const after=sites.get(site.siteId);
            if(blockedSites.has(site.siteId)){assert(!after,'C禁止史跡が残存: '+site.siteId);continue;}
            assert(after,'Phase1 approved site disappeared: '+site.siteId);
            if(approvedNewPins.has(site.siteId)){assert(after.publicPin,'承認済みピン漏れ: '+site.siteId);continue;}
            assert.equal(after.publicPin,site.publicPin,'Unapproved Phase1 pin classification change: '+site.siteId);
            if(site.publicPin){
              assert.deepEqual(after.point,site.point,'Phase1 pin GPS changed: '+site.siteId);
              assert.deepEqual(after.pinReview,site.pinReview,'Phase1 B safety changed: '+site.siteId);
            }
          }
          assert(!p2.histories.some(x=>x.historyId==='sg2hist-nobutora-kofu-founding'||x.historyId==='sg2hist-katsuyori-1582-death'));
          assert.equal(p2.notes.cRelease.v8.newPhase2Records,248);
          assert.equal(p2.notes.cRelease.v8.newPhase2Pins,44);
          assert.equal(p2.retiredHistories.length,0);
          assert(!p2.histories.some(h=>h.approval.sheetRow===4041));
          const hachijo=sites.get('sg2site-a-hachijo-hideie-residence-20261123');
          assert(hachijo&&hachijo.pinReview.accessStatus==='red'&&core.pinDetails(hachijo).noRouting);
          console.log('PHASE2_RELEASE_PASS 88 people / 1589 histories / 553 sites / 521 pins; Phase1 unchanged');
          NODE
      - name: Prepare deterministic municipality and map dependencies
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Verify actual Phase2 index pointer on PC Chromium and iPhone WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/c-p2-http.log 2>&1 &
          sleep 2
          node --test tests/c-v8-phase2-release.browser.cjs
