name: Bundle Hachioji boundaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-hachioji.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Hachioji town boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p town-data
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 150 \
            'https://geoshape.ex.nii.ac.jp/ka/topojson/2020/13/r2ka13201.topojson' \
            -o town-data/13201.topojson
          python3 - <<'PYCODE'
          import json, pathlib
          path=pathlib.Path('town-data/13201.topojson')
          data=json.loads(path.read_text(encoding='utf-8'))
          assert data.get('type') == 'Topology', 'Unexpected boundary file format'
          objects=data.get('objects',{})
          assert objects, 'TopoJSON has no objects'
          count=sum(len(obj.get('geometries',[])) for obj in objects.values())
          assert count >= 30, f'Too few Hachioji town boundaries: {count}'
          print(f'Validated {count} town polygons, {path.stat().st_size} bytes')
          PYCODE
      - name: Commit verified local copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add town-data/13201.topojson
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle verified Hachioji town boundaries'
            git push
          fi
