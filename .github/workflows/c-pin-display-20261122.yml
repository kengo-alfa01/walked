name: C historic-site popup and source link QA (staging only)
on:
  push:
    branches: [c/pin-display-20261122]
    paths:
      - .github/workflows/c-pin-display-20261122.yml
      - index.html
      - sengoku-pin-display.js
      - sengoku-v2-core.js
      - qa/pin-display-candidates-20261122.json
      - tests/c-pin-display-20261122.test.cjs
      - tests/c-pin-display-20261122-browser.smoke.cjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/c-pin-display-20261122.yml
      - index.html
      - sengoku-pin-display.js
      - sengoku-v2-core.js
      - qa/pin-display-candidates-20261122.json
      - tests/c-pin-display-20261122.test.cjs
      - tests/c-pin-display-20261122-browser.smoke.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 419 pins, 140 pending B candidates and link DOM separators
        run: node --test tests/c-pin-display-20261122.test.cjs
      - name: Existing 74-person and approved 80 release regression
        run: node --test tests/sengoku-v2.test.cjs tests/c-20261120-new9-release.test.cjs
  browser-interaction:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Prepare verified municipality geometry fixture
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Real WebKit iPhone and Chromium PC pin text, source tap and stored-card QA
        env:
          WALKED_BROWSER_ASSETS: .qa-assets
          WALKED_BASE_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walked-c-pin-display.log 2>&1 &
          sleep 2
          node --test tests/c-pin-display-20261122-browser.smoke.cjs
