name: Bundle Sengoku corrected municipalities v0.6.5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify town boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p town-data
          for code in 13204 14135 19205 19206; do
            prefecture="${code:0:2}"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 150 \
              "https://geoshape.ex.nii.ac.jp/ka/topojson/2020/${prefecture}/r2ka${code}.topojson" \
              -o "town-data/${code}.topojson"
          done
          python3 - <<'PYCODE'
          import json, pathlib
          for code in ['13204','14135','19205','19206']:
              path=pathlib.Path(f'town-data/{code}.topojson')
              topo=json.loads(path.read_text(encoding='utf-8'))
              assert topo.get('type')=='Topology', code
              assert sum(len(x.get('geometries',[])) for x in topo.get('objects',{}).values())>0, code
              print(code, path.stat().st_size)
          PYCODE
      - name: Commit validated boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add town-data/13204.topojson town-data/14135.topojson town-data/19205.topojson town-data/19206.topojson
          if ! git diff --cached --quiet; then
            git commit -m 'Update Sengoku corrected municipality boundaries'
            git push
          else
            echo 'No changes to commit'
          fi
