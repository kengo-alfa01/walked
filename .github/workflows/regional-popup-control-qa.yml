name: Temporary Regional Popup Control QA
on:
  push:
    branches:
      - feature/regional-map-popup-mode-guard
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Install WebKit and Chromium
        run: npx playwright install --with-deps webkit chromium
      - name: Prepare pinned map fixtures
        shell: bash
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error \
            'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' \
            --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Run Node regressions
        env:
          WALKED_BROWSER_ASSETS: ${{ github.workspace }}/.qa-assets
        run: node --test tests/*.test.cjs
      - name: Run WebKit and Chromium smoke
        env:
          WALKED_BROWSER_ASSETS: ${{ github.workspace }}/.qa-assets
          WALKED_BASE_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/regional-popup-control-http.log 2>&1 &
          sleep 2
          node --test tests/sengoku-v2-mobile.smoke.cjs
