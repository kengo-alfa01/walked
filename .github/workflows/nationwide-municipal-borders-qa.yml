name: Nationwide municipal boundaries iPhone QA

on:
  push:
    branches:
      - feature/nationwide-municipal-borders-20261115
    paths:
      - 'index.html'
      - 'tests/municipal-border.test.cjs'
      - 'tests/home-base-mobile.smoke.cjs'
      - '.github/workflows/nationwide-municipal-borders-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: municipal-borders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test packages
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 topojson-client@3.1.0 playwright@1.56.1 leaflet@1.9.4
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Pinned national geometry fixture
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error \
            'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' \
            --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
          test -s .qa-assets/municipalities.topojson
      - name: JS syntax and regional unit/integration regression
        env:
          WALKED_BROWSER_ASSETS: ${{ github.workspace }}/.qa-assets
        run: |
          node --check walked-core.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          Path('/tmp/walked-municipal-inline.js').write_text(html.rsplit('<script>',1)[-1].split('</script>',1)[0])
          PY
          node --check /tmp/walked-municipal-inline.js
          node --test tests/municipal-border.test.cjs tests/home-base.test.cjs tests/home-base-integration.test.cjs tests/title-backup.test.cjs tests/map-search.test.cjs
      - name: Start localhost preview (no main/production writes)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walked-municipal-http.log 2>&1 &
          sleep 2
      - name: Run iPhone WebKit QA and screenshots
        env:
          WALKED_BROWSER_ASSETS: ${{ github.workspace }}/.qa-assets
          WALKED_BASE_URL: http://127.0.0.1:8765
        run: node --test tests/home-base-mobile.smoke.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-municipal-borders-iphone
          path: preview-artifacts/*.png
          if-no-files-found: warn
