name: C approved 16 pin display QA (⑥3686-3701)
on:
  push:
    branches: [c/pin-display-approved16-20261122]
  pull_request:
    branches: [main]
    paths:
      - index.html
      - sengoku-pin-display.js
      - sengoku-pin-approved-v2.js
      - sengoku/v2/approved-pin-display-20261122-v2.json
      - tests/c-approved16-pin-display-20261122.test.cjs
      - tests/c-approved16-pin-browser.smoke.cjs
      - .github/workflows/c-approved16-pin-display.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0
      - name: User ⑥, B, ③ fixed 16 published display vs unchanged other 403 QA
        run: node --test tests/c-approved16-pin-display-20261122.test.cjs
      - name: Original source JSON, 419 pins, history/area/card and 80 ⑥-approved records regression
        run: node --test tests/sengoku-v2.test.cjs tests/c-20261120-new9-release.test.cjs tests/c-20261119-fixed57-release.test.cjs tests/sengoku-v2-dom.test.cjs
  browser-qa:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Prepare original geometry test fixtures
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Real iPhone WebKit and PC Chromium source/pin taps and legacy records
        env:
          WALKED_BROWSER_ASSETS: .qa-assets
          WALKED_BASE_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walked-c-approved16.log 2>&1 &
          sleep 2
          node --test tests/c-approved16-pin-browser.smoke.cjs
