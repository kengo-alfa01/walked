name: Import Sengoku batch
on:
  push:
    paths:
      - 'sengoku/batches/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and merge all batches
        run: |
          for file in sengoku/batches/*.json; do
            if [ -f "$file" ]; then python3 scripts/merge_sengoku_batch.py "$file"; fi
          done
      - name: Commit catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sengoku/people.json sengoku/sites.json sengoku/links.json sengoku/cards.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import Sengoku catalog batch'
            git push
          else
            echo 'Nothing new to import'
          fi
