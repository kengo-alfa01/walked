name: C historic-site mobile bottom sheet and PC popup QA
on:
  push:
    branches: [c/mobile-sengoku-pin-sheet-20261122]
  pull_request:
    branches: [main]
    paths:
      - index.html
      - sengoku-pin-sheet.js
      - sengoku-pin-sheet.css
      - tests/c-sengoku-pin-sheet*
      - tests/c-approved16-pin-browser.smoke.cjs
      - tests/c-20261120-new9-browser.smoke.cjs
      - tests/support/app.cjs
      - .github/workflows/c-sengoku-pin-sheet.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 topojson-client@3.1.0
      - name: Prepare vetted municipality topology for existing DOM regressions
        run: |
          mkdir -p .qa-assets
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Mobile sheet, approved 419/16, saved cards, chronology, map colors and backup QA
        env:
          WALKED_BROWSER_ASSETS: .qa-assets
        run: |
          node --test tests/c-sengoku-pin-sheet.test.cjs tests/c-approved16-pin-display-20261122.test.cjs tests/c-approved-ui-only-20261122.test.cjs tests/sengoku-v2.test.cjs tests/c-20261120-new9-release.test.cjs tests/sengoku-100-pin-qa.test.cjs tests/sengoku-chronology.test.cjs tests/map-coloring.test.cjs tests/title-backup.test.cjs
  webkit-chromium:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit Chromium Leaflet and TopoJSON
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 leaflet@1.9.4 topojson-client@3.1.0
      - name: Prepare pinned geometry; compare against current pre-release public application
        run: |
          mkdir -p .qa-assets .qa-screenshots
          curl --fail --location --retry 4 --retry-delay 2 --silent --show-error 'https://cdn.jsdelivr.net/gh/kyodo-official/japan-choropleth@78f20994bcdd7afbbbf8bf0b8aeb88b9e314a713/data/topojson/municipalities.topojson' --output .qa-assets/municipalities.topojson
          cp node_modules/topojson-client/dist/topojson-client.min.js .qa-assets/topojson-client.min.js
      - name: Real Safari Chrome 390, small 320, landscape, PC; screenshot before and after
        env:
          WALKED_BROWSER_ASSETS: .qa-assets
          WALKED_SCREENSHOT_DIR: .qa-screenshots
          WALKED_BASE_URL: http://127.0.0.1:8765
          WALKED_BEFORE_BASE_URL: https://kengo-alfa01.github.io/walked
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/walked-sheet-http.log 2>&1 &
          sleep 2
          node --test tests/c-sengoku-pin-sheet.browser.cjs tests/c-approved16-pin-browser.smoke.cjs tests/c-20261120-new9-browser.smoke.cjs
      - name: Save before and after screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: C-bottom-sheet-before-after-20261122
          path: .qa-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
